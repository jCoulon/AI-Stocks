name: News RSS et FinBERT

# Collecte les flux RSS de news par action (Yahoo Finance, Nasdaq) plusieurs fois par jour,
# puis calcule le ton FinBERT des nouveaux titres (y compris ceux de GDELT).
# La planification ne s'active que lorsque ce fichier est sur la branche par défaut (main).
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      extra:
        description: "Titres supplémentaires hors univers, séparés par des virgules"
        default: "IREN"
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/collect-news-rss.yml"
      - "scripts/collect_rss.py"
      - "scripts/score_finbert.py"
      - "sp500_analyzer/providers/rss.py"
      - "sp500_analyzer/providers/finbert.py"

permissions:
  contents: write

concurrency:
  group: fetch-data-${{ github.ref }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Flux RSS (Yahoo Finance, Nasdaq)
        timeout-minutes: 10
        continue-on-error: true
        run: python -u scripts/collect_rss.py --out data --extra "${{ github.event.inputs.extra || 'IREN' }}"

      - name: Cache du modèle FinBERT
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: finbert-${{ runner.os }}-v1

      - name: Ton FinBERT des nouveaux titres
        timeout-minutes: 25
        continue-on-error: true
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=4.40,<5"
          python -u scripts/score_finbert.py --data data

      - name: Enregistrement dans la branche
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle."
          else
            git commit -m "News RSS et ton FinBERT"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
