name: News et macro réelles

# Télécharge de vraies news (GDELT), les dépôts SEC (EDGAR) et des séries macro (FRED) depuis
# un runner GitHub (accès Internet) et les enregistre en CSV dans la branche.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Début (AAAA-MM-JJ) ; les news GDELT sont limitées aux ~3 derniers mois"
        default: "2026-01-01"
      extra:
        description: "Titres supplémentaires hors univers, séparés par des virgules"
        default: "IREN"
      only:
        description: "Sources : news, sec, macro"
        default: "news,sec,macro"
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/fetch-news-macro.yml"
      - "scripts/fetch_news_macro.py"
      - "sp500_analyzer/providers/realnews.py"

permissions:
  contents: write

concurrency:
  group: fetch-data-${{ github.ref }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Téléchargement (FRED, SEC EDGAR, GDELT)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python scripts/fetch_news_macro.py --start "${{ github.event.inputs.start || '2026-01-01' }}" \
            --extra "${{ github.event.inputs.extra || 'IREN' }}" \
            --only "${{ github.event.inputs.only || 'news,sec,macro' }}" --out data

      - name: Enregistrement dans la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle."
          else
            git commit -m "News et macro réelles (GDELT, SEC EDGAR, FRED)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: news-macro
          path: |
            data/news/
            data/sec/
            data/macro/
