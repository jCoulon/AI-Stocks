name: News et macro réelles

# Télécharge de vraies news (GDELT), les dépôts SEC (EDGAR) et des séries macro (FRED) depuis
# un runner GitHub (accès Internet) et les enregistre en CSV dans la branche.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Début (AAAA-MM-JJ) ; les news GDELT sont limitées aux ~3 derniers mois"
        default: "2026-01-01"
      extra:
        description: "Titres supplémentaires hors univers, séparés par des virgules"
        default: "IREN"
      only:
        description: "Sources : google (Google News), news (GDELT), sec, macro"
        default: "google,news,sec,macro"
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/fetch-news-macro.yml"
      - "scripts/fetch_news_macro.py"
      - "sp500_analyzer/providers/realnews.py"
      - "sp500_analyzer/providers/googlenews.py"

permissions:
  contents: write

concurrency:
  group: fetch-data-${{ github.ref }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Dernier état de la branche (et non le commit déclencheur) : un run mis en file
      # d'attente repart des données enregistrées par le run précédent.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Une étape par source, chacune bornée dans le temps et non bloquante : ce qui a été
      # téléchargé est enregistré même si une source est lente ou inaccessible.
      - name: Macro (FRED, sinon Trésor / Fed de New York / BLS / Yahoo)
        timeout-minutes: 10
        continue-on-error: true
        if: contains(github.event.inputs.only || 'google,news,sec,macro', 'macro')
        run: python -u scripts/fetch_news_macro.py --only macro --start "${{ github.event.inputs.start || '2026-01-01' }}" --out data

      - name: Dépôts SEC (EDGAR)
        timeout-minutes: 10
        continue-on-error: true
        if: contains(github.event.inputs.only || 'google,news,sec,macro', 'sec')
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -u scripts/fetch_news_macro.py --only sec --start "${{ github.event.inputs.start || '2026-01-01' }}" \
            --extra "${{ github.event.inputs.extra || 'IREN' }}" --out data

      - name: News financières (Google News)
        timeout-minutes: 45
        continue-on-error: true
        if: contains(github.event.inputs.only || 'google,news,sec,macro', 'google')
        run: |
          python -u scripts/fetch_news_macro.py --only google --start "${{ github.event.inputs.start || '2026-01-01' }}" \
            --extra "${{ github.event.inputs.extra || 'IREN' }}" --out data --budget 40

      - name: News (GDELT)
        timeout-minutes: 30
        continue-on-error: true
        if: contains(github.event.inputs.only || 'google,news,sec,macro', 'news')
        run: |
          python -u scripts/fetch_news_macro.py --only news --start "${{ github.event.inputs.start || '2026-01-01' }}" \
            --extra "${{ github.event.inputs.extra || 'IREN' }}" --out data --budget 25

      - name: Cache du modèle FinBERT
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: finbert-${{ runner.os }}-v1

      - name: Ton FinBERT des nouveaux titres
        timeout-minutes: 20
        continue-on-error: true
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=4.40,<5"
          python -u scripts/score_finbert.py --data data

      - name: Enregistrement dans la branche
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle."
          else
            git commit -m "News et macro réelles (GDELT, SEC EDGAR, FRED)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-macro
          if-no-files-found: ignore
          path: |
            data/news/
            data/sec/
            data/macro/
