name: Données de recherche (FINRA, Wikipédia, cours 5 ans)

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Sources : daily,short,wiki"
        default: "daily,short,wiki"
      start:
        description: "Début (AAAA-MM-JJ)"
        default: "2023-01-01"
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/fetch-research-data.yml"
      - "scripts/fetch_research_data.py"

permissions:
  contents: write

concurrency:
  group: research-data-${{ github.ref }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Téléchargement
        timeout-minutes: 50
        continue-on-error: true
        run: |
          python -u scripts/fetch_research_data.py --out data --budget 40 \
            --only "${{ github.event.inputs.only || 'daily,short,wiki' }}" \
            --start "${{ github.event.inputs.start || '2023-01-01' }}"

      - name: Enregistrement dans la branche
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle."
          else
            git commit -m "Données de recherche (FINRA, Wikipédia, cours 5 ans)"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi
